# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: meiliscan

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: meiliscan
    binary: meiliscan
    main: ./cmd/meiliscan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/asabla/meiliscan/internal/cli.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: asabla
    name: meiliscan
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ## Installation
    
    ### Homebrew (macOS/Linux)
    ```bash
    brew install asabla/tap/meiliscan
    ```
    
    ### Download binary
    Download the appropriate archive for your platform from the assets below, extract, and add to your PATH.
    
    ### Go install
    ```bash
    go install github.com/asabla/meiliscan/cmd/meiliscan@v{{.Version}}
    ```

homebrew_casks:
  - name: meiliscan
    repository:
      owner: asabla
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/asabla/meiliscan"
    description: "Static analysis tool for Meilisearch instances"
    license: "MIT"
    url:
      verified: github.com/asabla/meiliscan
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/meiliscan"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Announce releases (optional, can be enabled later)
# announce:
#   discord:
#     enabled: true
